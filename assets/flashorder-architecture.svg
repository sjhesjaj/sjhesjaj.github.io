<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" role="img" aria-labelledby="title desc">
  <title id="title">FlashOrder V1 架构与请求链路</title>
  <desc id="desc">客户端请求经过 API 进程的六步入口检查写入 MySQL；scheduler 进程的 Outbox Relay 把建单命令发到 Kafka；consumer 进程消费命令并在 MySQL 中完成建单事务；scheduler 同时负责超时取消；Prometheus 抓取各角色指标。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
    <style>
      text { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif; fill: #1f2328; }
      .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace; }
      .h1 { font-size: 22px; font-weight: 700; }
      .sub { font-size: 13px; fill: #57606a; }
      .h2 { font-size: 15px; font-weight: 700; }
      .h3 { font-size: 13px; font-weight: 700; }
      .body { font-size: 11.5px; fill: #424a53; }
      .small { font-size: 11px; fill: #57606a; }
      .label { font-size: 11px; fill: #424a53; }
      .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .pill { font-size: 11px; font-weight: 700; }
      .flow { stroke: #57606a; stroke-width: 1.5; fill: none; }
      .flow-strong { stroke: #1f6feb; stroke-width: 2.2; fill: none; }
      .flow-dash { stroke: #57606a; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="820" fill="#ffffff"/>

  <!-- Title -->
  <text x="24" y="40" class="h1">FlashOrder V1 架构与请求链路</text>
  <text x="24" y="64" class="sub">async 模式，开启入口保护。MySQL 是唯一事实来源；Kafka 按活动分区，让同一活动的建单命令依次落到库存行上。</text>

  <!-- Client -->
  <rect x="24" y="262" width="128" height="96" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
  <text x="88" y="292" class="h2" text-anchor="middle">客户端</text>
  <text x="88" y="314" class="small mono" text-anchor="middle">X-User-Id</text>
  <text x="88" y="330" class="small mono" text-anchor="middle">Idempotency-Key</text>
  <text x="88" y="346" class="small" text-anchor="middle">轮询 Location</text>

  <line x1="152" y1="296" x2="194" y2="296" class="flow" marker-end="url(#arrow)"/>
  <text x="173" y="289" class="label" text-anchor="middle">请求</text>
  <line x1="196" y1="324" x2="154" y2="324" class="flow-dash" marker-end="url(#arrow)"/>
  <text x="173" y="340" class="label" text-anchor="middle">响应</text>

  <!-- API process -->
  <rect x="196" y="84" width="384" height="466" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="214" y="110" class="h2">API 进程</text>
  <text x="562" y="110" class="small" text-anchor="end">profile api · :8080</text>
  <text x="214" y="128" class="small">入口检查按顺序执行，便宜的放前面</text>

  <!-- Step 1 -->
  <rect x="214" y="140" width="348" height="46" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="234" cy="163" r="11" fill="#424a53"/>
  <text x="234" y="167" class="num" text-anchor="middle">1</text>
  <text x="254" y="159" class="h3">用户级限流</text>
  <text x="254" y="176" class="small">Redis 令牌桶，默认每秒 5 个、突发 10</text>
  <rect x="498" y="152" width="52" height="22" rx="11" fill="#fff4e5" stroke="#e8b04d"/>
  <text x="524" y="167" class="pill" text-anchor="middle" fill="#9a5b00" style="fill:#9a5b00">429</text>

  <!-- Step 2 -->
  <rect x="214" y="200" width="348" height="46" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="234" cy="223" r="11" fill="#424a53"/>
  <text x="234" y="227" class="num" text-anchor="middle">2</text>
  <text x="254" y="219" class="h3">幂等回查</text>
  <text x="254" y="236" class="small">按 (user_id, 幂等键) 点查已有请求</text>
  <rect x="498" y="212" width="52" height="22" rx="11" fill="#eaf2ff" stroke="#7aa7f0"/>
  <text x="524" y="227" class="pill" text-anchor="middle" style="fill:#1f5fbf">重放</text>

  <!-- Step 3 -->
  <rect x="214" y="260" width="348" height="46" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="234" cy="283" r="11" fill="#424a53"/>
  <text x="234" y="287" class="num" text-anchor="middle">3</text>
  <text x="254" y="279" class="h3">活动窗口与售罄</text>
  <text x="254" y="296" class="small">本地快照，每 200 ms 刷新，600 ms 失效</text>
  <rect x="498" y="272" width="52" height="22" rx="11" fill="#fff4e5" stroke="#e8b04d"/>
  <text x="524" y="287" class="pill" text-anchor="middle" style="fill:#9a5b00">409</text>

  <!-- Step 4 -->
  <rect x="214" y="320" width="348" height="46" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="234" cy="343" r="11" fill="#424a53"/>
  <text x="234" y="347" class="num" text-anchor="middle">4</text>
  <text x="254" y="339" class="h3">活动级限流</text>
  <text x="254" y="356" class="small">Redis 令牌桶，默认每秒 200 个、突发 20</text>
  <rect x="498" y="332" width="52" height="22" rx="11" fill="#fff4e5" stroke="#e8b04d"/>
  <text x="524" y="347" class="pill" text-anchor="middle" style="fill:#9a5b00">429</text>

  <!-- Step 5 -->
  <rect x="214" y="380" width="348" height="46" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="234" cy="403" r="11" fill="#424a53"/>
  <text x="234" y="407" class="num" text-anchor="middle">5</text>
  <text x="254" y="399" class="h3">在途门槛（仅 async）</text>
  <text x="254" y="416" class="small">本地 ACCEPTED 计数，每 1 s 采样，默认 500</text>
  <rect x="498" y="392" width="52" height="22" rx="11" fill="#fff4e5" stroke="#e8b04d"/>
  <text x="524" y="407" class="pill" text-anchor="middle" style="fill:#9a5b00">503</text>

  <!-- Step 6 -->
  <rect x="214" y="440" width="348" height="46" rx="8" fill="#ffffff" stroke="#1f6feb" stroke-width="1.4"/>
  <circle cx="234" cy="463" r="11" fill="#1f6feb"/>
  <text x="234" y="467" class="num" text-anchor="middle">6</text>
  <text x="254" y="459" class="h3">受理事务</text>
  <text x="254" y="476" class="small">请求行 + 建单命令写入同一事务</text>
  <rect x="498" y="452" width="52" height="22" rx="11" fill="#e8f5ec" stroke="#6cc08b"/>
  <text x="524" y="467" class="pill" text-anchor="middle" style="fill:#1a7f37">202</text>

  <text x="214" y="512" class="small">sync 模式：第 6 步之后在同一事务里直接建单，</text>
  <text x="214" y="529" class="small">返回 201 或 409，不经过 Kafka。</text>

  <!-- Redis -->
  <rect x="676" y="84" width="248" height="100" rx="10" fill="#fdf1f0" stroke="#d4776f" stroke-width="1.2"/>
  <text x="694" y="110" class="h2">Redis 7.4</text>
  <text x="694" y="131" class="body">只做限流：用户桶、活动桶</text>
  <text x="694" y="149" class="body">Lua + Redis TIME，原子补充和扣减</text>
  <text x="694" y="167" class="body">停机时降级为进程内令牌桶</text>

  <line x1="564" y1="163" x2="674" y2="163" class="flow" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="619" y="156" class="label" text-anchor="middle">步骤 1、4</text>

  <!-- MySQL -->
  <rect x="676" y="206" width="248" height="344" rx="10" fill="#eef4fb" stroke="#5b8ac4" stroke-width="1.2"/>
  <text x="694" y="232" class="h2">MySQL 8.4</text>
  <text x="694" y="250" class="small">唯一事实来源 · READ COMMITTED</text>
  <text x="694" y="276" class="body mono">campaign · inventory</text>
  <text x="694" y="294" class="body mono">purchase_request</text>
  <text x="694" y="312" class="body mono">purchase_order</text>
  <text x="694" y="330" class="body mono">payment_attempt</text>
  <text x="694" y="348" class="body"><tspan class="mono">outbox_message</tspan>（带租约）</text>
  <line x1="694" y1="364" x2="906" y2="364" stroke="#b6cbe6" stroke-width="1"/>
  <text x="694" y="384" class="body">• CHECK：0 ≤ available ≤ total</text>
  <text x="694" y="402" class="body">• 每个用户每个活动一个活跃订单</text>
  <text x="706" y="419" class="small">生成列 active_flag + 唯一索引</text>
  <text x="694" y="438" class="body">• 每个请求最多一单</text>
  <text x="694" y="456" class="body">• 支付不碰库存行</text>
  <rect x="690" y="472" width="220" height="62" rx="8" fill="#ffffff" stroke="#b6cbe6"/>
  <text x="704" y="494" class="h3">对账恒等式</text>
  <text x="704" y="514" class="body mono">total = available</text>
  <text x="736" y="528" class="body">+ 待支付 + 已支付</text>

  <!-- API <-> MySQL -->
  <line x1="564" y1="223" x2="674" y2="223" class="flow" marker-end="url(#arrow)"/>
  <text x="619" y="216" class="label" text-anchor="middle">幂等点查</text>
  <line x1="674" y1="283" x2="564" y2="283" class="flow-dash" marker-end="url(#arrow)"/>
  <text x="619" y="276" class="label" text-anchor="middle">快照 · 200 ms</text>
  <line x1="674" y1="403" x2="564" y2="403" class="flow-dash" marker-end="url(#arrow)"/>
  <text x="619" y="396" class="label" text-anchor="middle">计数 · 1 s</text>
  <line x1="564" y1="463" x2="674" y2="463" class="flow-strong" marker-end="url(#arrow-strong)"/>
  <text x="619" y="456" class="label" text-anchor="middle" style="fill:#1f5fbf">受理事务</text>

  <!-- Consumer -->
  <rect x="1000" y="206" width="256" height="344" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="1018" y="232" class="h2">consumer 进程</text>
  <text x="1238" y="232" class="small" text-anchor="end">管理端口 :18082</text>
  <text x="1018" y="250" class="small">每个分区一个线程，逐条处理</text>
  <rect x="1016" y="264" width="224" height="186" rx="8" fill="#ffffff" stroke="#1f6feb" stroke-width="1.4"/>
  <text x="1030" y="286" class="h3">建单事务（与 sync 共用）</text>
  <text x="1030" y="308" class="body">1  锁请求行，已是终态就跳过</text>
  <text x="1030" y="327" class="body">2  设保存点，插入 PENDING 订单</text>
  <text x="1030" y="346" class="body">3  写订单事件，标记 ORDER_CREATED</text>
  <text x="1030" y="365" class="body">4  最后扣库存：available − 1</text>
  <text x="1030" y="384" class="body">5  提交，然后提交 offset</text>
  <text x="1030" y="410" class="small" style="fill:#9a5b00">售罄或已持有：回滚到保存点，</text>
  <text x="1030" y="427" class="small" style="fill:#9a5b00">在同一事务里写 REJECTED</text>
  <text x="1018" y="476" class="body">技术异常：退避重试 3 次</text>
  <text x="1018" y="495" class="body">用尽后写 SYSTEM_FAILED + 死信</text>
  <text x="1018" y="514" class="small">同一个恢复事务，死信由 Relay 发出</text>
  <text x="1018" y="533" class="small">重复投递：请求已是终态，直接结束</text>

  <!-- Consumer -> MySQL -->
  <line x1="998" y1="300" x2="926" y2="300" class="flow-strong" marker-end="url(#arrow-strong)"/>
  <text x="962" y="293" class="label" text-anchor="middle" style="fill:#1f5fbf">建单事务</text>

  <!-- Scheduler -->
  <rect x="676" y="606" width="248" height="190" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="694" y="632" class="h2">scheduler 进程</text>
  <text x="906" y="632" class="small" text-anchor="end">管理端口 :18081</text>
  <rect x="692" y="646" width="216" height="64" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="706" y="668" class="h3">Outbox Relay</text>
  <text x="706" y="686" class="small">短事务领取并写租约，事务外发送</text>
  <text x="706" y="702" class="small">收到 ACK 后按租约令牌确认发布</text>
  <rect x="692" y="720" width="216" height="62" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="706" y="742" class="h3">超时取消</text>
  <text x="706" y="760" class="small">SKIP LOCKED 领取到期订单</text>
  <text x="706" y="776" class="small">取消，并按活动升序归还库存</text>

  <!-- MySQL <-> Scheduler -->
  <line x1="724" y1="552" x2="724" y2="604" class="flow" marker-end="url(#arrow)"/>
  <text x="716" y="583" class="label" text-anchor="end">领取（SKIP LOCKED）</text>
  <line x1="876" y1="604" x2="876" y2="552" class="flow" marker-end="url(#arrow)"/>
  <text x="884" y="583" class="label">确认发布 / 取消归还</text>

  <!-- Kafka -->
  <rect x="1000" y="606" width="256" height="190" rx="10" fill="#f4f1fb" stroke="#8a74c4" stroke-width="1.2"/>
  <text x="1018" y="632" class="h2">Kafka 4.2.2 · KRaft</text>
  <text x="1018" y="658" class="body mono">flashorder.order-commands</text>
  <text x="1018" y="675" class="small">key = campaign_id，共 6 个分区</text>
  <text x="1018" y="704" class="body mono">flashorder.order-events</text>
  <text x="1018" y="721" class="small">订单事件，第一版没有下游</text>
  <text x="1018" y="750" class="body mono">flashorder.order-commands.DLT</text>
  <text x="1018" y="767" class="small">死信：重试用尽或命令无效</text>

  <!-- Scheduler -> Kafka -->
  <line x1="924" y1="678" x2="998" y2="678" class="flow" marker-end="url(#arrow)"/>
  <text x="961" y="671" class="label" text-anchor="middle">发布</text>

  <!-- Kafka -> Consumer -->
  <line x1="1128" y1="604" x2="1128" y2="552" class="flow" marker-end="url(#arrow)"/>
  <text x="1136" y="583" class="label">投递命令</text>

  <!-- Monitoring -->
  <rect x="196" y="606" width="384" height="92" rx="10" fill="#f2f8f3" stroke="#86b892" stroke-width="1.2"/>
  <text x="214" y="630" class="h3">监控 · Prometheus + mysqld-exporter</text>
  <text x="214" y="651" class="small">抓取 API :8080、scheduler :18081、consumer :18082</text>
  <text x="214" y="669" class="small">InnoDB 行锁等待、Hikari 连接池、Kafka lag、终态延迟、</text>
  <text x="214" y="687" class="small">入口拒绝、限流后端、Outbox 积压、取消失败</text>

  <!-- Legend -->
  <rect x="24" y="712" width="556" height="84" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <line x1="44" y1="738" x2="88" y2="738" class="flow" marker-end="url(#arrow)"/>
  <text x="96" y="742" class="small">调用或写入</text>
  <line x1="190" y1="738" x2="234" y2="738" class="flow-dash" marker-end="url(#arrow)"/>
  <text x="242" y="742" class="small">定时读取（本地快照刷新）</text>
  <line x1="410" y1="738" x2="454" y2="738" class="flow-strong" marker-end="url(#arrow-strong)"/>
  <text x="462" y="742" class="small">核心事务</text>
  <rect x="44" y="760" width="62" height="22" rx="11" fill="#fff4e5" stroke="#e8b04d"/>
  <text x="75" y="775" class="pill" text-anchor="middle" style="fill:#9a5b00">4xx/5xx</text>
  <text x="114" y="775" class="small">快速拒绝，不写记录</text>
  <rect x="232" y="760" width="52" height="22" rx="11" fill="#eaf2ff" stroke="#7aa7f0"/>
  <text x="258" y="775" class="pill" text-anchor="middle" style="fill:#1f5fbf">重放</text>
  <text x="292" y="775" class="small">返回已有请求的结果</text>
  <rect x="410" y="760" width="52" height="22" rx="11" fill="#e8f5ec" stroke="#6cc08b"/>
  <text x="436" y="775" class="pill" text-anchor="middle" style="fill:#1a7f37">202</text>
  <text x="470" y="775" class="small">受理成功</text>
</svg>
